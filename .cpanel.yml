---
# Deploy desde cPanel Git Version Control: solo "Deploy HEAD Commit".
# Este repo vive clonado directo en wp-content/themes/talos-theme, así que
# traer lo último de GitHub ya es publicarlo. "Update from Remote" falla sin
# avisar en este server; con el pull aquí basta el botón Deploy.
deployment:
  tasks:
    - git pull --ff-only origin main
